<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c62828">
<title>尾羽急電鉄 ルーレット2</title>
<style>
:root{--red:#c62828;--dark:#991b1b;--soft:#fff1f1;--ink:#242424;--muted:#777;--line:#ececec}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{width:min(760px,calc(100% - 32px));margin:auto;padding:38px 0 48px}
.eyebrow{color:var(--red);font-size:11px;font-weight:800;letter-spacing:.14em}
h1{font-size:clamp(27px,5vw,38px);line-height:1.25;margin:10px 0 8px;letter-spacing:-.04em}
.subtitle{color:var(--muted);margin:0 0 28px;font-size:14px}
.panel{border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #0000000b}
.label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:12px}
.results{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:13px;padding:15px 16px;min-width:0}
.card.primary{background:var(--soft);border-color:#f5caca}
.small{font-size:12px;color:var(--muted);margin-bottom:7px}
.value{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.placeholder{color:#b5b5b5;font-weight:600}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-top:10px}
.stop{border:1px solid #f0d0d0;background:#fffafa;padding:12px;border-radius:11px}
.num{font-size:10px;color:var(--red);font-weight:800;letter-spacing:.08em;margin-bottom:5px}
.name{font-size:16px;font-weight:750;overflow-wrap:anywhere}
button{width:100%;border:0;border-radius:12px;padding:16px 20px;background:var(--red);color:white;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px;box-shadow:0 5px 0 var(--dark)}
button:hover{background:#b71c1c}button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--dark)}button:disabled{opacity:.7;cursor:wait}
.note{font-size:12px;line-height:1.7;color:var(--muted);text-align:center;margin:16px 0 0}
.status{min-height:1.4em;margin-top:12px;text-align:center;color:var(--red);font-size:13px;font-weight:700}
footer{color:#aaa;font-size:10px;text-align:center;margin-top:24px;letter-spacing:.08em}
@media(min-width:560px){.results{grid-template-columns:180px 1fr}.card:first-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="eyebrow">OBAKYU RAILWAY · RANDOM ROUTE</div>
<h1>尾羽急電鉄 ルーレット2</h1>
<p class="subtitle">経由数を決めて、その数だけ行き先を抽選します。</p>
<section class="panel" aria-live="polite">
<div class="label">抽選結果</div>
<div class="results">
<div class="card primary"><div class="small">① 経由数</div><div id="count" class="value placeholder">—</div></div>
<div class="card"><div class="small">② 行き先ルーレットの結果</div><div id="routes" class="routes"><div class="value placeholder">—</div></div></div>
</div>
<button id="spin" type="button">ルーレットを回す</button>
<div id="status" class="status" role="status"></div>
<p class="note">経由数は「1・1・2・2・2・3」から抽選します。<br>行き先は指定された駅名から、経由数と同じ回数だけ抽選します。</p>
</section>
<footer>OBAKYU RAILWAY · RANDOM ROUTE GENERATOR</footer>
</main>
<script>
"use strict";
const counts=[1,1,2,2,2,3];
const destinations=["尾羽原","井口","梅郷","雲中","安越","十川真砂橋","千峰","南雲谷","雲谷","長峰","西高徳","高徳","明神前","舞子台","紀田","穂","瀬舞","余美","千鳥","問屋町","問屋蔵前","赤堀大沢","赤堀","新赤堀","塚野","金田","百鳥","西百鳥","支線尾羽","北尾羽","新高徳","高徳整備場北","高徳空港","鵲橋","金田市","金田空港","金田新都心","新箱倉金田","南箱倉","上井口","参田町","東本郷","本郷","西問屋町","本郷神宮前","千鳥山道","奥千鳥","南千鳥","水橋","飛岡","垂岡","飛水竜田","南竜田","大原","新塚","飛水柏原","上金田","赤堀アリーナ","科学研究所跡"];
const countEl=document.getElementById("count"),routesEl=document.getElementById("routes"),statusEl=document.getElementById("status"),button=document.getElementById("spin");
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
button.addEventListener("click",async()=>{
 button.disabled=true;
 routesEl.replaceChildren();
 countEl.className="value";
 statusEl.textContent="経由数を抽選中…";
 const spinFor=async(duration,update)=>{
  const start=performance.now();
  while(true){
   const remaining=duration-(performance.now()-start);
   if(remaining<=0)break;
   update();
   await wait(Math.min(70,remaining));
  }
 };
 await spinFor(2000,()=>{countEl.textContent=pick(counts)+" 駅";});
 const n=pick(counts);
 countEl.textContent=n+" 駅";
 for(let i=0;i<n;i++){
  statusEl.textContent=`行き先 ${i+1} / ${n} を抽選中…`;
  const card=document.createElement("div");card.className="stop";
  const num=document.createElement("div");num.className="num";num.textContent="STOP "+String(i+1).padStart(2,"0");
  const name=document.createElement("div");name.className="name";
  card.append(num,name);routesEl.append(card);
  await spinFor(2000,()=>{name.textContent=pick(destinations);});
  name.textContent=pick(destinations);
 }
 statusEl.textContent="抽選完了。よい運行を！";
 button.disabled=false;
});
</script>
</body>
</html>
